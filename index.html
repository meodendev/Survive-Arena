<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Survive Arena - 2 Người</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #gameWrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 9 / 16;
            background: #1a1a2e;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #2d4059;
            touch-action: none;
        }

        /* UI */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #topBar {
            position: absolute;
            top: 6px;
            left: 0;
            width: 100%;
            padding: 0 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #topBar .score {
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 12px;
            border-radius: 12px;
        }
        #topBar .score.p1 {
            color: #ff6b6b;
        }
        #topBar .score.p2 {
            color: #4ecdc4;
        }
        #roundDisplay {
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 0 0 10px #000;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 14px;
            border-radius: 12px;
        }

        #hpContainer {
            position: absolute;
            top: 36px;
            left: 0;
            width: 100%;
            padding: 0 10px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .hp-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hp-wrap .label {
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            text-shadow: 0 0 6px #000;
            margin-bottom: 2px;
        }
        .hp-track {
            width: 100%;
            height: 8px;
            background: #2a2a3e;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #444;
        }
        .hp-fill {
            height: 100%;
            width: 100%;
            transition: width 0.15s;
            border-radius: 10px;
        }
        .hp-fill.p1 {
            background: linear-gradient(90deg, #ff4444, #ff6b6b);
        }
        .hp-fill.p2 {
            background: linear-gradient(90deg, #44aaff, #4ecdc4);
        }

        /* Điều khiển */
        #controls {
            position: absolute;
            bottom: 8px;
            left: 0;
            width: 100%;
            height: 48%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            padding: 0 6px;
        }

        .ctrl-group {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 46%;
            gap: 4px;
        }

        .joystick-area {
            width: 100%;
            aspect-ratio: 1/1;
            max-width: 130px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 80%);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            position: relative;
            touch-action: none;
            cursor: pointer;
        }
        .joystick-area .knob {
            width: 38%;
            height: 38%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.2) 100%);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            transition: none;
        }

        .btn-row {
            display: flex;
            gap: 6px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2px;
        }
        .action-btn {
            pointer-events: auto;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            transition: transform 0.05s;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
        }
        .action-btn:active {
            transform: scale(0.85);
            background: rgba(255, 255, 255, 0.2);
        }
        .action-btn.shoot {
            background: rgba(255, 50, 50, 0.3);
            border-color: rgba(255, 50, 50, 0.5);
        }
        .action-btn.bomb {
            background: rgba(255, 150, 0, 0.3);
            border-color: rgba(255, 150, 0, 0.5);
        }
        .action-btn.speed {
            background: rgba(50, 200, 255, 0.3);
            border-color: rgba(50, 200, 255, 0.5);
        }

        .ctrl-group.p1 .action-btn.shoot {
            background: rgba(255, 70, 70, 0.35);
        }
        .ctrl-group.p2 .action-btn.shoot {
            background: rgba(70, 180, 255, 0.35);
        }

        /* Nút restart */
        #restartBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: 2px solid #fff;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        #restartBtn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        #winnerMsg {
            position: absolute;
            top: 28%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            display: none;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 20px;
            border-radius: 16px;
            z-index: 10;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .action-btn {
                width: 40px;
                height: 40px;
                font-size: 15px;
            }
            #topBar .score {
                font-size: 11px;
                padding: 1px 8px;
            }
            #roundDisplay {
                font-size: 11px;
                padding: 1px 10px;
            }
        }
        @media (max-height: 700px) {
            .action-btn {
                width: 36px;
                height: 36px;
                font-size: 13px;
            }
            .btn-row {
                gap: 4px;
            }
            #controls {
                height: 44%;
            }
        }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <canvas id="gameCanvas"></canvas>

        <div id="ui">
            <div id="topBar">
                <span class="score p1" id="scoreP1">🏆 0</span>
                <span id="roundDisplay">⚔️ Round 1</span>
                <span class="score p2" id="scoreP2">0 🏆</span>
            </div>
            <div id="hpContainer">
                <div class="hp-wrap">
                    <span class="label">❤️ P1</span>
                    <div class="hp-track"><div class="hp-fill p1" id="hpP1" style="width:100%"></div></div>
                </div>
                <div class="hp-wrap">
                    <span class="label">❤️ P2</span>
                    <div class="hp-track"><div class="hp-fill p2" id="hpP2" style="width:100%"></div></div>
                </div>
            </div>
            <div id="winnerMsg"></div>
            <button id="restartBtn">🔄 Đấu lại</button>
        </div>

        <div id="controls">
            <!-- Player 1 -->
            <div class="ctrl-group p1">
                <div class="joystick-area" id="joyP1">
                    <div class="knob" id="knobP1"></div>
                </div>
                <div class="btn-row">
                    <div class="action-btn shoot" id="shootP1">🔫</div>
                    <div class="action-btn bomb" id="bombP1">💣</div>
                    <div class="action-btn speed" id="speedP1">⚡</div>
                </div>
            </div>

            <!-- Player 2 -->
            <div class="ctrl-group p2">
                <div class="joystick-area" id="joyP2">
                    <div class="knob" id="knobP2"></div>
                </div>
                <div class="btn-row">
                    <div class="action-btn speed" id="speedP2">⚡</div>
                    <div class="action-btn bomb" id="bombP2">💣</div>
                    <div class="action-btn shoot" id="shootP2">🔫</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  SURVIVE ARENA - Local 2 Players
        //  Chạy trên GitHub Pages, không cần server
        // ============================================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Kích thước canvas theo tỉ lệ 9:16
        const W = 420;
        const H = 746;
        canvas.width = W;
        canvas.height = H;

        // DOM refs
        const hpP1 = document.getElementById('hpP1');
        const hpP2 = document.getElementById('hpP2');
        const scoreP1 = document.getElementById('scoreP1');
        const scoreP2 = document.getElementById('scoreP2');
        const roundDisplay = document.getElementById('roundDisplay');
        const winnerMsg = document.getElementById('winnerMsg');
        const restartBtn = document.getElementById('restartBtn');

        // ============ GAME STATE ============
        const G = {
            players: [],
            bullets: [],
            bombs: [],
            items: [],
            particles: [],
            obstacles: [],
            bushes: [],
            zone: { x: W / 2, y: H / 2, radius: 280, targetRadius: 280, phase: 0 }, // phase 0=chờ, 1=đang thu
            round: 1,
            score1: 0,
            score2: 0,
            state: 'playing', // 'playing' | 'roundEnd' | 'matchEnd'
            winner: null,
            timer: 0,
            zoneTimer: 0,
            zoneShrinkSpeed: 0.4,
            spawnTimer: 0,
        };

        // ============ CONSTANTS ============
        const PLAYER_RADIUS = 14;
        const BULLET_RADIUS = 4;
        const BOMB_RADIUS = 8;
        const MAX_HP = 100;
        const BULLET_DAMAGE = 10;
        const BOMB_DAMAGE = 35;
        const BOMB_BLAST_RADIUS = 80;
        const MEDKIT_HEAL = 25;
        const SPEED_DURATION = 5; // giây
        const ZONE_DAMAGE = 3; // /giây
        const WIN_ROUNDS = 5;
        const PLAYER_SPEED = 1.8;
        const BULLET_SPEED = 6;
        const SHOOT_COOLDOWN = 0.25; // giây
        const BOMB_COOLDOWN = 2.0;

        // ============ PLAYER CLASS ============
        class Player {
            constructor(id, x, y, color, side) {
                this.id = id;
                this.x = x;
                this.y = y;
                this.radius = PLAYER_RADIUS;
                this.color = color;
                this.side = side; // 'left' or 'right'
                this.hp = MAX_HP;
                this.maxHp = MAX_HP;
                this.speed = PLAYER_SPEED;
                this.baseSpeed = PLAYER_SPEED;
                this.angle = 0;
                this.shootCooldown = 0;
                this.bombCooldown = 0;
                this.speedBoost = 0;
                this.shield = 0;
                this.alive = true;
                this.dirX = 0;
                this.dirY = 0;
                // Input
                this.input = { dx: 0, dy: 0, shoot: false, bomb: false, speed: false };
            }

            update(dt) {
                if (!this.alive) return;
                // Cooldowns
                if (this.shootCooldown > 0) this.shootCooldown -= dt;
                if (this.bombCooldown > 0) this.bombCooldown -= dt;
                if (this.speedBoost > 0) {
                    this.speedBoost -= dt;
                    this.speed = this.baseSpeed * 1.7;
                    if (this.speedBoost <= 0) this.speed = this.baseSpeed;
                }
                if (this.shield > 0) this.shield -= dt;

                // Di chuyển
                const len = Math.hypot(this.input.dx, this.input.dy);
                if (len > 0.1) {
                    const normX = this.input.dx / len;
                    const normY = this.input.dy / len;
                    this.x += normX * this.speed * dt * 60;
                    this.y += normY * this.speed * dt * 60;
                    this.angle = Math.atan2(normY, normX);
                }

                // Giới hạn trong map (có viền)
                const margin = 20;
                this.x = Math.max(margin, Math.min(W - margin, this.x));
                this.y = Math.max(margin, Math.min(H - margin, this.y));

                // Bắn
                if (this.input.shoot && this.shootCooldown <= 0) {
                    this.shootCooldown = SHOOT_COOLDOWN;
                    return 'shoot';
                }
                // Bom
                if (this.input.bomb && this.bombCooldown <= 0) {
                    this.bombCooldown = BOMB_COOLDOWN;
                    return 'bomb';
                }
                // Tăng tốc
                if (this.input.speed && this.speedBoost <= 0) {
                    this.speedBoost = SPEED_DURATION;
                    this.input.speed = false; // dùng 1 lần
                    return 'speed';
                }
                return null;
            }

            takeDamage(dmg) {
                if (this.shield > 0) {
                    this.shield = 0;
                    return;
                }
                this.hp = Math.max(0, this.hp - dmg);
                if (this.hp <= 0) {
                    this.hp = 0;
                    this.alive = false;
                }
            }

            getPos() { return { x: this.x, y: this.y }; }
        }

        // ============ KHỞI TẠO ============
        function initRound() {
            G.players = [];
            G.bullets = [];
            G.bombs = [];
            G.items = [];
            G.particles = [];
            G.obstacles = [];
            G.bushes = [];
            G.state = 'playing';
            G.winner = null;
            G.timer = 0;
            G.zoneTimer = 0;
            G.zone.radius = 280;
            G.zone.targetRadius = 280;
            G.zone.phase = 0;

            // Player 1 (trái)
            const p1 = new Player(1, 120, H / 2, '#ff6b6b', 'left');
            // Player 2 (phải)
            const p2 = new Player(2, W - 120, H / 2, '#4ecdc4', 'right');

            // Hướng mặt vào nhau
            p1.angle = 0;
            p2.angle = Math.PI;

            G.players.push(p1, p2);

            // Tạo vật cản
            createObstacles();
            createBushes();

            // Spawn vài item ban đầu
            spawnItems(4);

            updateUI();
            winnerMsg.style.display = 'none';
            restartBtn.style.display = 'none';
        }

        function createObstacles() {
            const obs = [
                { x: 160, y: 160, w: 40, h: 40, type: 'box' },
                { x: 220, y: 160, w: 40, h: 40, type: 'box' },
                { x: 160, y: 220, w: 40, h: 40, type: 'box' },
                { x: W - 200, y: 160, w: 40, h: 40, type: 'box' },
                { x: W - 260, y: 160, w: 40, h: 40, type: 'box' },
                { x: W - 200, y: 220, w: 40, h: 40, type: 'box' },
                { x: 100, y: 500, w: 50, h: 30, type: 'rock' },
                { x: W - 150, y: 500, w: 50, h: 30, type: 'rock' },
                { x: 200, y: 400, w: 30, h: 60, type: 'wall' },
                { x: W - 230, y: 400, w: 30, h: 60, type: 'wall' },
                { x: W / 2 - 20, y: 350, w: 40, h: 40, type: 'box' },
            ];
            G.obstacles = obs;
        }

        function createBushes() {
            G.bushes = [
                { x: 80, y: 300, w: 50, h: 30 },
                { x: W - 130, y: 300, w: 50, h: 30 },
                { x: 60, y: 580, w: 50, h: 30 },
                { x: W - 110, y: 580, w: 50, h: 30 },
                { x: W / 2 - 30, y: 260, w: 60, h: 30 },
            ];
        }

        function spawnItems(count) {
            for (let i = 0; i < count; i++) {
                const types = ['medkit', 'speed', 'shield', 'shotgun', 'rifle', 'sniper'];
                const type = types[Math.floor(Math.random() * types.length)];
                let x, y, valid;
                let attempts = 0;
                do {
                    x = 40 + Math.random() * (W - 80);
                    y = 40 + Math.random() * (H - 80);
                    valid = true;
                    // Không spawn lên người chơi
                    for (const p of G.players) {
                        if (Math.hypot(x - p.x, y - p.y) < 60) valid = false;
                    }
                    // Không spawn lên vật cản
                    for (const o of G.obstacles) {
                        if (x > o.x - 30 && x < o.x + o.w + 30 && y > o.y - 30 && y < o.y + o.h + 30) valid = false;
                    }
                    attempts++;
                } while (!valid && attempts < 30);
                if (valid) {
                    G.items.push({ x, y, type, radius: 12, timer: 0 });
                }
            }
        }

        // ============ UPDATE ============
        function update(dt) {
            if (G.state === 'roundEnd' || G.state === 'matchEnd') return;

            G.timer += dt;

            // Zone
            if (G.timer > 30 && G.zone.phase === 0) {
                G.zone.phase = 1;
                G.zone.targetRadius = 120;
                G.zoneTimer = 0;
            }
            if (G.zone.phase === 1) {
                G.zoneTimer += dt;
                const shrink = G.zoneShrinkSpeed * dt * 60;
                if (G.zone.radius > G.zone.targetRadius) {
                    G.zone.radius = Math.max(G.zone.targetRadius, G.zone.radius - shrink);
                } else {
                    G.zone.phase = 2;
                }
                // Sát thương ngoài zone
                for (const p of G.players) {
                    if (!p.alive) continue;
                    const dist = Math.hypot(p.x - G.zone.x, p.y - G.zone.y);
                    if (dist > G.zone.radius) {
                        p.takeDamage(ZONE_DAMAGE * dt);
                        if (!p.alive) checkRoundEnd();
                    }
                }
            }

            // Spawn item định kỳ
            G.spawnTimer += dt;
            if (G.spawnTimer > 8 && G.items.length < 10) {
                spawnItems(2);
                G.spawnTimer = 0;
            }

            // Update players
            for (const p of G.players) {
                if (!p.alive) continue;
                const action = p.update(dt);
                if (action === 'shoot') {
                    shootBullet(p);
                } else if (action === 'bomb') {
                    throwBomb(p);
                }
                // Kiểm tra zone damage
                const dist = Math.hypot(p.x - G.zone.x, p.y - G.zone.y);
                if (dist > G.zone.radius) {
                    p.takeDamage(ZONE_DAMAGE * dt);
                    if (!p.alive) checkRoundEnd();
                }
            }

            // Update bullets
            for (let i = G.bullets.length - 1; i >= 0; i--) {
                const b = G.bullets[i];
                b.x += b.vx * dt * 60;
                b.y += b.vy * dt * 60;
                b.life -= dt;
                if (b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
                    G.bullets.splice(i, 1);
                    continue;
                }
                // Va chạm với vật cản
                let hitObs = false;
                for (const o of G.obstacles) {
                    if (b.x > o.x && b.x < o.x + o.w && b.y > o.y && b.y < o.y + o.h) {
                        hitObs = true;
                        spawnParticles(b.x, b.y, '#888', 6);
                        break;
                    }
                }
                if (hitObs) { G.bullets.splice(i, 1); continue; }

                // Va chạm với player
                for (const p of G.players) {
                    if (!p.alive || p.id === b.ownerId) continue;
                    if (Math.hypot(b.x - p.x, b.y - p.y) < p.radius + BULLET_RADIUS) {
                        p.takeDamage(BULLET_DAMAGE);
                        spawnParticles(b.x, b.y, '#ff0', 10);
                        G.bullets.splice(i, 1);
                        if (!p.alive) checkRoundEnd();
                        break;
                    }
                }
            }

            // Update bombs
            for (let i = G.bombs.length - 1; i >= 0; i--) {
                const b = G.bombs[i];
                b.timer -= dt;
                if (b.timer <= 0) {
                    // Nổ
                    explodeBomb(b);
                    G.bombs.splice(i, 1);
                }
            }

            // Update items - nhặt
            for (let i = G.items.length - 1; i >= 0; i--) {
                const item = G.items[i];
                item.timer += dt;
                for (const p of G.players) {
                    if (!p.alive) continue;
                    if (Math.hypot(item.x - p.x, item.y - p.y) < p.radius + item.radius) {
                        applyItem(p, item);
                        spawnParticles(item.x, item.y, '#0f0', 8);
                        G.items.splice(i, 1);
                        break;
                    }
                }
            }

            updateUI();
        }

        function shootBullet(player) {
            const angle = player.angle;
            const spread = (Math.random() - 0.5) * 0.08;
            const a = angle + spread;
            G.bullets.push({
                x: player.x + Math.cos(a) * 22,
                y: player.y + Math.sin(a) * 22,
                vx: Math.cos(a) * BULLET_SPEED,
                vy: Math.sin(a) * BULLET_SPEED,
                radius: BULLET_RADIUS,
                ownerId: player.id,
                life: 1.5,
                damage: BULLET_DAMAGE,
            });
            spawnParticles(player.x + Math.cos(a) * 22, player.y + Math.sin(a) * 22, '#ffa500', 4);
        }

        function throwBomb(player) {
            const angle = player.angle;
            const dist = 30;
            G.bombs.push({
                x: player.x + Math.cos(angle) * dist,
                y: player.y + Math.sin(angle) * dist,
                radius: BOMB_RADIUS,
                ownerId: player.id,
                timer: 1.2,
                vx: Math.cos(angle) * 1.2,
                vy: Math.sin(angle) * 1.2,
            });
        }

        function explodeBomb(bomb) {
            // Sát thương
            for (const p of G.players) {
                if (!p.alive) continue;
                const dist = Math.hypot(bomb.x - p.x, bomb.y - p.y);
                if (dist < BOMB_BLAST_RADIUS) {
                    const dmg = BOMB_DAMAGE * (1 - dist / BOMB_BLAST_RADIUS);
                    p.takeDamage(Math.round(dmg));
                    if (!p.alive) checkRoundEnd();
                }
            }
            // Particles
            spawnParticles(bomb.x, bomb.y, '#ff6600', 30);
            spawnParticles(bomb.x, bomb.y, '#ff4400', 20);
            // Xóa vật cản gần
            for (let i = G.obstacles.length - 1; i >= 0; i--) {
                const o = G.obstacles[i];
                const cx = o.x + o.w / 2,
                    cy = o.y + o.h / 2;
                if (Math.hypot(bomb.x - cx, bomb.y - cy) < BOMB_BLAST_RADIUS * 0.6) {
                    spawnParticles(cx, cy, '#8B7355', 10);
                    G.obstacles.splice(i, 1);
                }
            }
        }

        function applyItem(player, item) {
            switch (item.type) {
                case 'medkit':
                    player.hp = Math.min(player.maxHp, player.hp + MEDKIT_HEAL);
                    break;
                case 'speed':
                    player.speedBoost = SPEED_DURATION;
                    break;
                case 'shield':
                    player.shield = 3;
                    break;
                case 'shotgun':
                    // Bắn 3 phát
                    for (let i = -1; i <= 1; i++) {
                        const a = player.angle + i * 0.25;
                        G.bullets.push({
                            x: player.x + Math.cos(a) * 22,
                            y: player.y + Math.sin(a) * 22,
                            vx: Math.cos(a) * BULLET_SPEED * 1.1,
                            vy: Math.sin(a) * BULLET_SPEED * 1.1,
                            radius: BULLET_RADIUS,
                            ownerId: player.id,
                            life: 1.2,
                            damage: 8,
                        });
                    }
                    break;
                case 'rifle':
                    // Bắn nhanh
                    for (let i = 0; i < 3; i++) {
                        const a = player.angle + (Math.random() - 0.5) * 0.15;
                        G.bullets.push({
                            x: player.x + Math.cos(a) * 22,
                            y: player.y + Math.sin(a) * 22,
                            vx: Math.cos(a) * BULLET_SPEED * 1.5,
                            vy: Math.sin(a) * BULLET_SPEED * 1.5,
                            radius: 3,
                            ownerId: player.id,
                            life: 1.0,
                            damage: 7,
                        });
                    }
                    break;
                case 'sniper':
                    // Đạn mạnh
                    const a = player.angle;
                    G.bullets.push({
                        x: player.x + Math.cos(a) * 22,
                        y: player.y + Math.sin(a) * 22,
                        vx: Math.cos(a) * BULLET_SPEED * 2.0,
                        vy: Math.sin(a) * BULLET_SPEED * 2.0,
                        radius: 5,
                        ownerId: player.id,
                        life: 1.8,
                        damage: 25,
                    });
                    break;
            }
        }

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 3;
                G.particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 2 + Math.random() * 4,
                    color,
                    life: 0.5 + Math.random() * 0.5,
                    maxLife: 1,
                });
            }
        }

        function checkRoundEnd() {
            const alive = G.players.filter(p => p.alive);
            if (alive.length === 1) {
                G.state = 'roundEnd';
                G.winner = alive[0];
                if (G.winner.id === 1) G.score1++;
                else G.score2++;
                // Kiểm tra match
                if (G.score1 >= WIN_ROUNDS || G.score2 >= WIN_ROUNDS) {
                    G.state = 'matchEnd';
                    showWinner(G.winner);
                } else {
                    showRoundWinner(G.winner);
                }
                updateUI();
            }
        }

        function showRoundWinner(player) {
            const name = player.id === 1 ? 'P1 🔴' : 'P2 🔵';
            winnerMsg.textContent = `🏆 ${name} thắng round!`;
            winnerMsg.style.display = 'block';
            restartBtn.style.display = 'block';
            restartBtn.textContent = '⏭️ Round tiếp';
        }

        function showWinner(player) {
            const name = player.id === 1 ? 'P1 🔴' : 'P2 🔵';
            winnerMsg.textContent = `👑 ${name} VÔ ĐỊCH! 👑`;
            winnerMsg.style.display = 'block';
            restartBtn.style.display = 'block';
            restartBtn.textContent = '🔄 Đấu lại trận';
        }

        // ============ UI UPDATE ============
        function updateUI() {
            const p1 = G.players[0];
            const p2 = G.players[1];
            if (p1) {
                hpP1.style.width = (p1.hp / p1.maxHp * 100) + '%';
            }
            if (p2) {
                hpP2.style.width = (p2.hp / p2.maxHp * 100) + '%';
            }
            scoreP1.textContent = '🏆 ' + G.score1;
            scoreP2.textContent = G.score2 + ' 🏆';
            roundDisplay.textContent = '⚔️ Round ' + G.round;
        }

        // ============ RENDER ============
        function render() {
            ctx.clearRect(0, 0, W, H);

            // Nền
            const grad = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 400);
            grad.addColorStop(0, '#3a5a7a');
            grad.addColorStop(1, '#1a2a3a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Vùng an toàn (zone)
            ctx.save();
            ctx.beginPath();
            ctx.arc(G.zone.x, G.zone.y, G.zone.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 255, 100, 0.05)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(0, 255, 100, 0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 8]);
            ctx.stroke();
            ctx.restore();

            // Bụi cỏ
            for (const b of G.bushes) {
                ctx.fillStyle = 'rgba(40, 120, 40, 0.5)';
                ctx.beginPath();
                ctx.ellipse(b.x + b.w / 2, b.y + b.h / 2, b.w / 2, b.h / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(50, 140, 50, 0.3)';
                ctx.beginPath();
                ctx.ellipse(b.x + b.w / 3, b.y + b.h / 3, b.w / 3, b.h / 3, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Vật cản
            for (const o of G.obstacles) {
                if (o.type === 'box') {
                    ctx.fillStyle = '#8B7D6B';
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 8;
                    ctx.fillRect(o.x, o.y, o.w, o.h);
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#6B5D4B';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(o.x, o.y, o.w, o.h);
                    // Vân gỗ
                    ctx.strokeStyle = 'rgba(100,80,60,0.3)';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.moveTo(o.x + 5 + i * 10, o.y + 2);
                        ctx.lineTo(o.x + 5 + i * 10, o.y + o.h - 2);
                        ctx.stroke();
                    }
                } else if (o.type === 'rock') {
                    ctx.fillStyle = '#7A7A7A';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(o.x + o.w / 2, o.y + o.h / 2, o.w / 2, o.h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(160,160,160,0.2)';
                    ctx.beginPath();
                    ctx.ellipse(o.x + o.w / 2 - 5, o.y + o.h / 2 - 5, o.w / 4, o.h / 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (o.type === 'wall') {
                    ctx.fillStyle = '#6B7B8D';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.fillRect(o.x, o.y, o.w, o.h);
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#4A5A6D';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(o.x, o.y, o.w, o.h);
                    // Gạch
                    for (let row = 0; row < o.h / 12; row++) {
                        for (let col = 0; col < o.w / 10; col++) {
                            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                            ctx.strokeRect(o.x + col * 10 + (row % 2) * 5, o.y + row * 12, 10, 12);
                        }
                    }
                }
            }

            // Items
            for (const item of G.items) {
                const glow = 0.3 + Math.sin(item.timer * 3) * 0.1;
                ctx.shadowColor = 'rgba(255,255,255,0.2)';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
                let color = '#fff';
                let symbol = '?';
                switch (item.type) {
                    case 'medkit':
                        color = '#ff3366';
                        symbol = '❤️';
                        break;
                    case 'speed':
                        color = '#33ddff';
                        symbol = '⚡';
                        break;
                    case 'shield':
                        color = '#66ff99';
                        symbol = '🛡';
                        break;
                    case 'shotgun':
                        color = '#ff8833';
                        symbol = '🔫';
                        break;
                    case 'rifle':
                        color = '#33ff88';
                        symbol = '🔫';
                        break;
                    case 'sniper':
                        color = '#ff33ff';
                        symbol = '🔫';
                        break;
                }
                ctx.fillStyle = color + '44';
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = color;
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(symbol, item.x, item.y + 1);
                // Vòng tròn nhấp nháy
                ctx.strokeStyle = color + '66';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(item.x, item.y, item.radius + 3 + Math.sin(item.timer * 2) * 2, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Bom
            for (const b of G.bombs) {
                const pulse = 1 + Math.sin(b.timer * 15) * 0.1;
                ctx.shadowColor = '#ff4400';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius * pulse, 0, Math.PI * 2);
                ctx.fillStyle = '#ff4400';
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ff8800';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('💣', b.x, b.y + 1);
                // Vòng nổ sắp tới
                if (b.timer < 0.5) {
                    ctx.strokeStyle = `rgba(255, 68, 0, ${0.5 - b.timer})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, BOMB_BLAST_RADIUS * (1 - b.timer / 0.5) * 0.5, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // Bullets
            for (const b of G.bullets) {
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffdd44';
                ctx.fill();
                ctx.shadowBlur = 0;
                // Trail
                ctx.fillStyle = 'rgba(255, 200, 50, 0.2)';
                ctx.beginPath();
                ctx.arc(b.x - b.vx * 0.5, b.y - b.vy * 0.5, b.radius * 0.8, 0, Math.PI * 2);
                ctx.fill();
            }

            // Players
            for (const p of G.players) {
                if (!p.alive) continue;
                const isP1 = p.id === 1;

                // Shadow
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 15;

                // Body
                const grad2 = ctx.createRadialGradient(p.x - 4, p.y - 4, 2, p.x, p.y, p.radius);
                grad2.addColorStop(0, isP1 ? '#ff8a8a' : '#6ee0d8');
                grad2.addColorStop(1, p.color);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad2;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = isP1 ? '#cc3333' : '#2aa89e';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Mặt
                const eyeX = p.x + Math.cos(p.angle) * 8;
                const eyeY = p.y + Math.sin(p.angle) * 8;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(eyeX - Math.sin(p.angle) * 5, eyeY + Math.cos(p.angle) * 5, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(eyeX + Math.sin(p.angle) * 5, eyeY + Math.cos(p.angle) * 5, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#222';
                ctx.beginPath();
                ctx.arc(eyeX - Math.sin(p.angle) * 5 + Math.cos(p.angle) * 2, eyeY + Math.cos(p.angle) * 5 + Math.sin(p
                    .angle) * 2, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(eyeX + Math.sin(p.angle) * 5 + Math.cos(p.angle) * 2, eyeY + Math.cos(p.angle) * 5 + Math.sin(p
                    .angle) * 2, 2.5, 0, Math.PI * 2);
                ctx.fill();

                // Shield
                if (p.shield > 0) {
                    ctx.strokeStyle = `rgba(100, 255, 150, ${0.3 + Math.sin(G.timer * 8) * 0.1})`;
                    ctx.lineWidth = 3;
                    ctx.setLineDash([4, 6]);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius + 8, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Speed boost indicator
                if (p.speedBoost > 0) {
                    ctx.strokeStyle = `rgba(50, 220, 255, ${0.2 + Math.sin(G.timer * 10) * 0.1})`;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius + 14, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Tên + HP
                ctx.fillStyle = '#fff';
                ctx.font = '9px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 6;
                ctx.fillText(isP1 ? 'P1' : 'P2', p.x, p.y - p.radius - 6);
                ctx.shadowBlur = 0;
                // Thanh HP nhỏ trên đầu
                const hpW = 28;
                const hpH = 3;
                const hpX = p.x - hpW / 2;
                const hpY = p.y - p.radius - 14;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(hpX, hpY, hpW, hpH);
                ctx.fillStyle = isP1 ? '#ff4444' : '#44aaff';
                ctx.fillRect(hpX, hpY, hpW * (p.hp / p.maxHp), hpH);
            }

            // Particles
            for (const pt of G.particles) {
                const alpha = pt.life / pt.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.radius * alpha, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Debug zone info
            if (G.zone.phase > 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '11px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('⚡ Zone đang thu hẹp', W / 2, 30);
            }
        }

        // ============ PARTICLES UPDATE ============
        function updateParticles(dt) {
            for (let i = G.particles.length - 1; i >= 0; i--) {
                const pt = G.particles[i];
                pt.x += pt.vx * dt * 60;
                pt.y += pt.vy * dt * 60;
                pt.vx *= 0.97;
                pt.vy *= 0.97;
                pt.life -= dt;
                if (pt.life <= 0) G.particles.splice(i, 1);
            }
        }

        // ============ GAME LOOP ============
        let lastTime = 0;

        function gameLoop(time) {
            const dt = Math.min((time - lastTime) / 1000, 0.05);
            lastTime = time;

            updateParticles(dt);
            update(dt);
            render();
            requestAnimationFrame(gameLoop);
        }

        // ============ INPUT HANDLING ============
        // Joystick
        function setupJoystick(elementId, knobId, player) {
            const el = document.getElementById(elementId);
            const knob = document.getElementById(knobId);
            const rect = el.getBoundingClientRect();
            const radius = el.offsetWidth / 2;

            let active = false;

            function handleMove(clientX, clientY) {
                const rect2 = el.getBoundingClientRect();
                const cx = rect2.left + rect2.width / 2;
                const cy = rect2.top + rect2.height / 2;
                let dx = clientX - cx;
                let dy = clientY - cy;
                const dist = Math.hypot(dx, dy);
                const maxDist = radius * 0.8;
                if (dist > maxDist) {
                    dx = dx / dist * maxDist;
                    dy = dy / dist * maxDist;
                }
                knob.style.transform = `translate(${dx - radius*0.19}px, ${dy - radius*0.19}px)`;
                const norm = Math.hypot(dx, dy);
                if (norm > 5) {
                    player.input.dx = dx / maxDist;
                    player.input.dy = dy / maxDist;
                } else {
                    player.input.dx = 0;
                    player.input.dy = 0;
                }
            }

            function handleEnd() {
                knob.style.transform = 'translate(-50%, -50%)';
                player.input.dx = 0;
                player.input.dy = 0;
                active = false;
            }

            el.addEventListener('touchstart', (e) => {
                e.preventDefault();
                active = true;
                const touch = e.touches[0];
                handleMove(touch.clientX, touch.clientY);
            }, { passive: false });

            el.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!active) return;
                const touch = e.touches[0];
                handleMove(touch.clientX, touch.clientY);
            }, { passive: false });

            el.addEventListener('touchend', (e) => {
                e.preventDefault();
                handleEnd();
            }, { passive: false });

            el.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                handleEnd();
            }, { passive: false });

            // Mouse support (debug trên desktop)
            let mouseDown = false;
            el.addEventListener('mousedown', (e) => {
                mouseDown = true;
                handleMove(e.clientX, e.clientY);
            });
            window.addEventListener('mousemove', (e) => {
                if (mouseDown) handleMove(e.clientX, e.clientY);
            });
            window.addEventListener('mouseup', () => {
                if (mouseDown) { mouseDown = false;
                    handleEnd(); }
            });
        }

        function setupButton(btnId, player, key) {
            const el = document.getElementById(btnId);
            el.addEventListener('touchstart', (e) => {
                e.preventDefault();
                player.input[key] = true;
            }, { passive: false });
            el.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (key === 'speed') {
                    // Speed chỉ dùng 1 lần, không giữ
                } else {
                    player.input[key] = false;
                }
            }, { passive: false });
            el.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                if (key !== 'speed') player.input[key] = false;
            }, { passive: false });
            // Mouse
            el.addEventListener('mousedown', () => {
                player.input[key] = true;
                if (key === 'speed') {
                    // Speed kích hoạt ngay lập tức
                    setTimeout(() => { player.input[key] = false; }, 50);
                }
            });
            el.addEventListener('mouseup', () => {
                if (key !== 'speed') player.input[key] = false;
            });
            el.addEventListener('mouseleave', () => {
                if (key !== 'speed') player.input[key] = false;
            });
        }

        // ============ RESTART ============
        restartBtn.addEventListener('click', () => {
            if (G.state === 'matchEnd') {
                G.score1 = 0;
                G.score2 = 0;
                G.round = 1;
            } else {
                G.round++;
            }
            initRound();
            // Reset input
            for (const p of G.players) {
                p.input = { dx: 0, dy: 0, shoot: false, bomb: false, speed: false };
            }
            document.getElementById('knobP1').style.transform = 'translate(-50%, -50%)';
            document.getElementById('knobP2').style.transform = 'translate(-50%, -50%)';
            G.players[0].input.dx = 0;
            G.players[0].input.dy = 0;
            G.players[1].input.dx = 0;
            G.players[1].input.dy = 0;
            winnerMsg.style.display = 'none';
            restartBtn.style.display = 'none';
        });

        // ============ START ============
        const p1 = new Player(1, 120, H / 2, '#ff6b6b', 'left');
        const p2 = new Player(2, W - 120, H / 2, '#4ecdc4', 'right');
        G.players = [p1, p2];

        setupJoystick('joyP1', 'knobP1', p1);
        setupJoystick('joyP2', 'knobP2', p2);
        setupButton('shootP1', p1, 'shoot');
        setupButton('bombP1', p1, 'bomb');
        setupButton('speedP1', p1, 'speed');
        setupButton('shootP2', p2, 'shoot');
        setupButton('bombP2', p2, 'bomb');
        setupButton('speedP2', p2, 'speed');

        initRound();
        // Reset knob
        document.getElementById('knobP1').style.transform = 'translate(-50%, -50%)';
        document.getElementById('knobP2').style.transform = 'translate(-50%, -50%)';

        requestAnimationFrame(gameLoop);
    </script>

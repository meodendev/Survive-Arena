<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Survive Arena</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="gameWrapper">
        <canvas id="gameCanvas"></canvas>

        <!-- MENU -->
        <div id="menu">
            <h1>⚔️ SURVIVE ARENA</h1>
            <div class="subtitle">Battle Royale trên điện thoại</div>
            <button class="menu-btn primary" id="btnLocal">👥 2 Người cùng máy</button>
            <button class="menu-btn" id="btnBot">🤖 Đấu với Bot</button>
            <button class="menu-btn" id="btnOnline">🌐 Online (Coming Soon)</button>
            <div class="controls-hint">
                <kbd>W A S D</kbd> P1 · <kbd>⬆ ⬇ ⬅ ➡</kbd> P2<br>
                <kbd>Space</kbd> P1 · <kbd>Enter</kbd> P2 bắn<br>
                <kbd>Q</kbd> P1 · <kbd>.</kbd> P2 bom<br>
                <kbd>E</kbd> P1 · <kbd>/</kbd> P2 đổi súng
            </div>
        </div>

        <!-- UI -->
        <div id="ui">
            <div id="topBar">
                <span class="score p1" id="scoreP1">🏆 0</span>
                <span id="roundDisplay">⚔️ Round 1</span>
                <span class="score p2" id="scoreP2">0 🏆</span>
            </div>
            <div id="hpContainer">
                <div class="hp-wrap">
                    <span class="label">❤️ P1</span>
                    <div class="hp-track"><div class="hp-fill p1" id="hpP1" style="width:100%"></div></div>
                </div>
                <div class="hp-wrap">
                    <span class="label">❤️ P2</span>
                    <div class="hp-track"><div class="hp-fill p2" id="hpP2" style="width:100%"></div></div>
                </div>
            </div>
            <div id="weaponDisplay">🔫 Pistol</div>
            <div id="winnerMsg"></div>
            <button id="restartBtn">🔄 Đấu lại</button>
        </div>

        <!-- Controls -->
        <div id="controls">
            <div class="ctrl-group p1">
                <div class="joystick-area" id="joyP1">
                    <div class="knob" id="knobP1"></div>
                </div>
                <div class="btn-row">
                    <div class="action-btn weapon" id="weaponP1">🔫</div>
                    <div class="action-btn shoot" id="shootP1">🔥</div>
                    <div class="action-btn bomb" id="bombP1">💣</div>
                    <div class="action-btn speed" id="speedP1">⚡</div>
                </div>
            </div>
            <div class="ctrl-group p2">
                <div class="joystick-area" id="joyP2">
                    <div class="knob" id="knobP2"></div>
                </div>
                <div class="btn-row">
                    <div class="action-btn speed" id="speedP2">⚡</div>
                    <div class="action-btn bomb" id="bombP2">💣</div>
                    <div class="action-btn shoot" id="shootP2">🔥</div>
                    <div class="action-btn weapon" id="weaponP2">🔫</div>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "./js/": "./js/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
